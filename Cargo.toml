[workspace]
resolver = "2"
members = [
    "crates/chorus-core",
    "crates/chorus-cli",
    "crates/chorus-acp",
    "crates/chorus-ffi",
    "crates/chorus-daemon",
    "crates/chorus-eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
blake3 = "1.5"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tempfile = "3"
similar = "2.6"
