name: ci

# Every push and pull request: the checks a contributor runs locally
# (CLAUDE.md §4), on macOS because the Seatbelt sandbox, and the tests that
# need it to refuse or allow a read-only turn, only exist there. macos-26:
# the shell uses macOS 26 SDK symbols (ToolbarSpacer) behind #available,
# which still need that SDK to compile — macos-14's Xcode cannot build it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Same as apps/macos/build.sh: the C in the Rust deps (sqlite, zstd, blake3)
# otherwise targets the runner's macOS and the app link warns
# "built for newer 'macOS' version (26.5) than being linked (14.0)".
env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build (all binaries — tests spawn acp-probe, see CLAUDE.md 7.8)
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace --no-fail-fast
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Bench invariants
        run: cargo run -p chorus-cli --bin chorus -- bench

  macos-app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the FFI library the app links
        run: cargo build -p chorus-ffi --lib
      - name: Swift build (warnings are errors — clippy already does this for Rust)
        working-directory: apps/macos
        run: swift build -Xswiftc -warnings-as-errors
      - name: Swift test
        working-directory: apps/macos
        run: swift test
