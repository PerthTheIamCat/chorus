name: release

# Push a tag like v0.1.2 -> build the dmg, sign the Sparkle appcast, publish the
# GitHub Release. Needs the repo secret SPARKLE_ED_KEY (see apps/macos/release.sh).
on:
  push:
    tags: ["v*"]
  # Release without pushing a tag (e.g. from an environment that may not push
  # tags): `gh release create` makes the tag on main.
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 0.2.4 (needs a CHANGELOG section)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26 # macOS 26 SDK needed to compile the shell; see ci.yml
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build, sign and publish
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          test -n "$SPARKLE_ED_KEY" || { echo "SPARKLE_ED_KEY secret is missing"; exit 1; }
          cd apps/macos
          ./release.sh "${TAG#v}" publish
